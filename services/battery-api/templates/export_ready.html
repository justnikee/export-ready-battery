<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Ready - AnvayaLabs</title>
</head>

<body
    style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 40px 20px;">
    <div
        style="max-width: 600px; margin: 0 auto; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #0d9488 0%, #0891b2 100%); padding: 32px; text-align: center;">
            <h1 style="margin: 0; font-size: 24px; color: white;">📦 Export Ready</h1>
            <p style="margin: 8px 0 0; color: rgba(255,255,255,0.9); font-size: 14px;">Battery Passport Registry</p>
        </div>

        <!-- Content -->
        <div style="padding: 32px;">
            {{.Content}}
        </div>

        <!-- Footer -->
        <div style="padding: 24px; text-align: center; background-color: #0a0f1a;">
            <p style="margin: 0; font-size: 12px; color: #475569;">
                © 2026 AnvayaLabs Battery. All rights reserved.
            </p>
        </div>
    </div>
</body>

</html>
