name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD & TEST
  # ═══════════════════════════════════════════════════════════════════
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps and services
        run: |
          pnpm run build
          for svc in services/*/; do
            if [ -f "$svc/go.mod" ]; then
              echo "Building $svc"
              (cd "$svc" && go build ./...)
            fi
          done

      - name: Run tests
        run: |
          pnpm run test
          for svc in services/*/; do
            if [ -f "$svc/go.mod" ]; then
              echo "Testing $svc"
              (cd "$svc" && go test ./...)
            fi
          done

  # ═══════════════════════════════════════════════════════════════════
  # DATABASE MIGRATIONS (run before deploy)
  # ═══════════════════════════════════════════════════════════════════
  migrate-battery:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run battery-api migrations
        run: cd services/battery-api && go run ./cmd/migration_runner up
        env:
          DATABASE_URL: ${{ secrets.BATTERY_DATABASE_URL }}

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY BACKEND — Oracle Cloud VM
  # ═══════════════════════════════════════════════════════════════════
  deploy-oracle:
    needs: [build-and-test, migrate-battery]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Linux AMD64 Binaries
        run: |
          cd services/battery-api
          GOOS=linux GOARCH=amd64 go build -o migrate ./cmd/migration_runner/main.go
          GOOS=linux GOARCH=amd64 go build -o battery-api ./cmd/server/main.go

      - name: Copy binaries, templates and migrations to Oracle VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "services/battery-api/battery-api,services/battery-api/migrate,services/battery-api/templates/**,services/battery-api/internal/db/migrations/*"
          target: "/home/ubuntu/app/"
          strip_components: 2

      - name: Restart battery-api Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo bash -c 'cat << "EOF" > /etc/systemd/system/battery-api.service
            [Unit]
            Description=ExportReady Battery API Service
            After=network.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/home/ubuntu/app
            ExecStartPre=-/home/ubuntu/app/migrate up
            ExecStart=/home/ubuntu/app/battery-api
            Restart=always
            RestartSec=5s
            EnvironmentFile=/home/ubuntu/app/.env

            [Install]
            WantedBy=multi-user.target
            EOF'
            sudo systemctl daemon-reload
            sudo systemctl restart battery-api
            sudo systemctl status battery-api --no-pager
